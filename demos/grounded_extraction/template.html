<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nutrient Grounded Data Extraction Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #1a1a1a;
            color: #f5f5f5;
        }
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .viewport {
            flex: 1;
            position: relative;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            background-color: #121212;
            border-right: 1px solid #333;
        }
        .pdf-container {
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .pdf-image {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .highlight-box {
            position: absolute;
            border: 2px solid #00ff66;
            background-color: rgba(0, 255, 102, 0.15);
            pointer-events: none;
            display: none;
            transition: all 0.1s ease;
        }
        .sidebar {
            width: 480px;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
        }
        .header {
            padding: 20px;
            border-bottom: 1px solid #333;
        }
        .header h1 {
            margin: 0;
            font-size: 1.25rem;
        }
        .fields-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .field-card {
            background-color: #2a2a2a;
            border: 1px solid #3d3d3d;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .field-card:hover, .field-card.active {
            background-color: #333333;
            border-color: #00ff66;
        }
        .field-path {
            font-family: "SFMono-Regular", Consolas, Menlo, monospace;
            font-size: 0.8rem;
            color: #aaa;
        }
        .field-value {
            font-weight: 600;
            margin-top: 6px;
            color: #fff;
        }
        .field-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.75rem;
        }
        .confidence {
            color: #00ff66;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="viewport">
            <div class="pdf-container" id="canvas-container">
                <img src="{{ image_src }}" class="pdf-image" id="target-image">
                <div class="highlight-box" id="highlight"></div>
            </div>
        </div>

        <div class="sidebar">
            <div class="header">
                <h1>Grounded Field Extraction</h1>
                <div style="font-size: 0.8rem; color:#aaa; margin-top:4px;">{{ doc_name }}</div>
            </div>
            <div class="fields-list">
                {% for card in cards %}
                <div class="field-card"
                     onmouseenter="highlightField({{ card.x }}, {{ card.y }}, {{ card.width }}, {{ card.height }})"
                     onmouseleave="clearHighlight()">
                    <div class="field-path">{{ card.path }}</div>
                    <div class="field-value">{{ card.value }}</div>
                    <div class="field-meta">
                        <span>Confidence: <span class="confidence">{{ card.confidence }}%</span></span>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <script>
        const image = document.getElementById('target-image');
        const highlight = document.getElementById('highlight');

        const PDF_WIDTH = {{ pdf_width }};
        const PDF_HEIGHT = {{ pdf_height }};

        const viewport = document.querySelector('.viewport');

        function highlightField(x, y, w, h) {
            const scaleX = image.clientWidth / PDF_WIDTH;
            const scaleY = image.clientHeight / PDF_HEIGHT;
            highlight.style.left   = (x * scaleX) + 'px';
            highlight.style.top    = (y * scaleY) + 'px';
            highlight.style.width  = (w * scaleX) + 'px';
            highlight.style.height = (h * scaleY) + 'px';
            highlight.style.display = 'block';
            const vpRect = viewport.getBoundingClientRect();
            const hlRect = highlight.getBoundingClientRect();
            const delta = (hlRect.top + hlRect.height / 2) - (vpRect.top + vpRect.height / 2);
            viewport.scrollBy({ top: delta, behavior: 'smooth' });
        }

        function clearHighlight() {
            highlight.style.display = 'none';
        }
    </script>
</body>
</html>
